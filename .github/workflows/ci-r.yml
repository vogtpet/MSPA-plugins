name: r CI

on:
  push:
    paths:
      - "r/**"
      - ".github/workflows/ci-r.yml"
  pull_request:
    paths:
      - "r/**"
      - ".github/workflows/ci-r.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash
        working-directory: r

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libsqlite3-dev libudunits2-dev

      - name: Install R packages
        run: Rscript scripts/install-deps.R

      - name: Fetch MSPA binaries
        run: ./scripts/fetch-binaries.sh

      - name: Smoke test
        if: runner.os != 'macOS'
        run: Rscript scripts/smoke-test.R

      - name: Update installer test
        run: Rscript tests/update-test.R

      # The MSPA 2.4 macOS ARM binary currently declares macOS 27 as its
      # minimum version (see MSPAstandalone). Keep this advisory until the
      # upstream build uses a lower deployment target.
      - name: Smoke test (macOS, advisory)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: Rscript scripts/smoke-test.R
