name: Release RMSPA

on:
  push:
    tags:
      - "r-v*"

permissions:
  contents: write

jobs:
  test:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash
        working-directory: r

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("terra", "shiny", "shinyFiles", "shinyjs", "later"))'

      - name: Fetch MSPA binaries
        run: ./scripts/fetch-binaries.sh

      - name: Smoke test
        if: runner.os != 'macOS'
        run: Rscript scripts/smoke-test.R

      - name: Smoke test (macOS, advisory)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: Rscript scripts/smoke-test.R

  release:
    name: build and publish
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: r

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag against VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#r-v}"
          echo "tag=${tag} VERSION=${version}"
          if [[ -z "${version}" || "${tag}" != "${version}" ]]; then
            echo "error: tag r-v${tag} does not match r/VERSION (${version})" >&2
            exit 1
          fi

      - name: Fetch MSPA binaries
        run: ./scripts/fetch-binaries.sh

      - name: Build release archive
        run: ./scripts/build-release.sh

      - name: Prepare release notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mspa_version="$(tr -d '[:space:]' < MSPA_VERSION)"
          {
            echo "MSPA engine: **${mspa_version}**"
            echo
            awk -v ver="${version}" '
              index($0, "## [" ver "]") == 1 {on=1; next}
              on && substr($0, 1, 4) == "## [" {exit}
              on {print}
            ' CHANGELOG.md
            echo
            echo "See [README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/r/README.md) for installation and usage."
          } > ../release-notes.md
          cat ../release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mspa_version="$(tr -d '[:space:]' < MSPA_VERSION)"
          gh release create "r-v${version}" \
            "dist/RMSPA-${version}.zip" \
            "dist/SHA256SUMS" \
            --title "RMSPA ${version} (MSPA ${mspa_version})" \
            --notes-file ../release-notes.md
